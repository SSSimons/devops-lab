<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Котик был доставлен через Kubernetes</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 18px; display: grid; place-items: center; background: #f2f5f8; color: #172c43; }
    main { width: min(100%, 650px); padding: 30px 24px; text-align: center; background: white; border: 1px solid #dce5ef; border-radius: 24px; box-shadow: 0 12px 36px #172c4310; }
    h1 { margin: 0 0 24px; font-size: clamp(23px, 4vw, 32px); line-height: 1.25; font-weight: 750; text-wrap: balance; }
    figure { margin: 0; }
    img { display: block; width: min(100%, 350px); height: auto; margin: auto; border-radius: 8px; }
    a { display: inline-block; margin-top: 24px; color: #195bbb; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #195bbb; outline-offset: 5px; border-radius: 3px; }
    @media (max-width: 420px) { main { padding: 24px 18px; } }
  </style>
</head>
<body>
  <main>
    <h1>Котик был доставлен через Kubernetes</h1>
    <figure>
      <img src="/cats/cat.png" width="350" height="484" alt="Котик KUBERCATES за разноцветными контейнерами">
    </figure>
    <a href="/">На главную</a>
  </main>
</body>
</html>

# Проверки выполняются на машине GitHub. Для основного стенда используется kubeadm.
name: Проверка проекта и развёртывания
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Проверка Python и Bash
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          export PATH="$PWD/.venv/bin:$PATH"
          # Следующие шаги и вложенные скрипты используют тот же Python с ujson.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python scripts/validate.py
          .venv/bin/python scripts/check-publication.py
          .venv/bin/python -m unittest discover -s tests -v
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck deploy.sh scripts/*.sh
          .venv/bin/python scripts/extract-configs.py
      - name: Проверка конфигураций компонентов
        run: |
          mkdir -p .state/configs/logs .state/configs/collected
          chmod 0777 .state/configs/logs .state/configs/collected
          touch .state/configs/logs/access.log .state/configs/logs/error.log
          chmod 0666 .state/configs/logs/access.log .state/configs/logs/error.log
          docker run --rm --network none --user 101:1000 --entrypoint nginx \
            -v "$PWD/.state/configs/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/.state/configs/logs:/logs" nginx:1.28.0-alpine -t
          docker run --rm --network none --user 1000:1000 --entrypoint fluentd \
            -v "$PWD/.state/configs/fluent.conf:/fluentd/etc/fluent.conf:ro" \
            -v "$PWD/.state/configs/logs:/logs:ro" \
            -v "$PWD/.state/configs/collected:/collected" \
            fluent/fluentd:v1.18.0-debian-1.0 --dry-run -c /fluentd/etc/fluent.conf
          docker run --rm --network none --entrypoint /bin/promtool \
            -v "$PWD/.state/configs:/etc/prometheus:ro" \
            prom/prometheus:v3.6.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --network none --entrypoint /bin/promtool \
            -v "$PWD:/work:ro" prom/prometheus:v3.6.0 \
            test rules /work/tests/prometheus-rules.yaml
      - name: Установка kind и kubectl
        run: |
          curl -fsSL --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o /tmp/kind
          curl -fsSL --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum -o /tmp/kind.sha256sum
          cd /tmp
          sed 's/kind-linux-amd64/kind/' kind.sha256sum | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL --retry 3 https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl -o /tmp/kubectl
          curl -fsSL --retry 3 https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl.sha256 -o /tmp/kubectl.sha256
          printf '%s  /tmp/kubectl\n' "$(cat /tmp/kubectl.sha256)" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Подготовка сети для Flannel
        # kind использует ядро машины GitHub. Основной kubeadm-стенд готовит bootstrap.sh.
        run: |
          sudo modprobe br_netfilter
          sudo modprobe vxlan
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1
          sudo sysctl -w net.ipv4.ip_forward=1
      - name: Создание временного кластера
        # kind проверяет манифесты и приложение, установку пакетов на Ubuntu VM проверяем отдельно.
        run: |
          kind create cluster --name lab --config config/kind-ci.yaml \
            --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          # Проверяем настройки внутри сетевого пространства узла, где запускается Flannel.
          docker exec lab-control-plane sysctl -w \
            net.bridge.bridge-nf-call-iptables=1 \
            net.bridge.bridge-nf-call-ip6tables=1 \
            net.ipv4.ip_forward=1
          kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
      - name: Установка CNI-плагинов в узел kind
        # Flannel устанавливает свой плагин, а bridge/host-local/portmap нужны отдельно.
        run: |
          CNI_VERSION=v1.7.1
          CNI_ARCHIVE="cni-plugins-linux-amd64-${CNI_VERSION}.tgz"
          CNI_URL="https://github.com/containernetworking/plugins/releases/download/${CNI_VERSION}"
          mkdir -p .state/cni
          curl -fsSL --retry 3 "$CNI_URL/$CNI_ARCHIVE" -o ".state/cni/$CNI_ARCHIVE"
          curl -fsSL --retry 3 "$CNI_URL/$CNI_ARCHIVE.sha256" -o ".state/cni/$CNI_ARCHIVE.sha256"
          (cd .state/cni && sha256sum -c "$CNI_ARCHIVE.sha256")
          docker exec lab-control-plane mkdir -p /opt/cni/bin
          # Передаём архив через stdin: docker cp и docker exec могут видеть разные /tmp.
          docker exec -i lab-control-plane tar -xzf - -C /opt/cni/bin < ".state/cni/$CNI_ARCHIVE"
          # Проверяем зависимости до ожидания CoreDNS, чтобы сразу увидеть проблему.
          for plugin in bridge host-local loopback portmap; do
            docker exec lab-control-plane test -x "/opt/cni/bin/$plugin"
          done
      - name: Развёртывание и проверка
        run: |
          bash scripts/deploy-stack.sh
          python3 scripts/verify.py --url http://127.0.0.1:30080 --report .state/ci-first.json
      - name: Повторное развёртывание и проверка
        # Второй запуск должен повторно пройти все проверки без сброса кластера и данных.
        run: |
          bash scripts/deploy-stack.sh
          python3 scripts/verify.py --url http://127.0.0.1:30080 --report .state/ci-repeat.json
      - name: Проверка ротации под нагрузкой
        run: python3 scripts/check-log-rotation.py --url http://127.0.0.1:30080
      - name: Диагностика ошибки
        if: failure()
        run: |
          mkdir -p .state
          {
            echo 'Сетевые настройки машины GitHub:'
            sysctl net.bridge.bridge-nf-call-iptables net.bridge.bridge-nf-call-ip6tables net.ipv4.ip_forward || true
            echo 'Сетевые настройки узла kind:'
            docker exec lab-control-plane sysctl net.bridge.bridge-nf-call-iptables net.bridge.bridge-nf-call-ip6tables net.ipv4.ip_forward || true
            echo 'Файл сети Flannel на узле:'
            docker exec lab-control-plane cat /run/flannel/subnet.env || true
            echo 'Установленные CNI-плагины узла:'
            docker exec lab-control-plane ls -lah /opt/cni/bin || true
            bash scripts/diagnose.sh || true
          } 2>&1 | tee .state/ci-diagnostics.txt
      - name: Сохранение отчётов проверки
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-verification
          path: |
            .state/ci-*.json
            .state/log-rotation.json
            .state/ci-diagnostics.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Удаление временного кластера
        if: always()
        run: kind delete cluster --name lab || true